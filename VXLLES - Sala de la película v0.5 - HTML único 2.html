}.pagehead{display:flex;justify-content:space-between;align-items:start;gap:20px;margin-bottom:30px}.pagehead>div p{font-size:13px;color:#778278}.primary{background:var(--green);color:#fff;border-color:var(--green);white-space:nowrap}.primary:hover{background:#183f2d}.premise{background:#e4eadd;border-left:3px solid #69906b;padding:26px 30px;margin-bottom:20px;font:20px/1.6 Georgia,serif}.hint{font-size:12px;color:#768274;margin-bottom:25px}.storyList{border-top:1px solid var(--line)}.storyList button{width:100%;text-align:left;display:flex;gap:20px;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:20px 5px}.storyList button span{font-size:10px;color:#899689}.storyList button strong{font-size:15px;font-weight:500}.storyList button small{display:block;margin-top:8px;font-size:11px;color:#798779}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{min-height:170px;background:#fff;border:1px solid var(--line);padding:22px;text-align:left;display:flex;flex-direction:column;align-items:start}.card strong{font-size:19px;font-weight:500}.card small{color:#859184;margin-top:20px}.back{border:0;padding:5px 0;margin-bottom:27px;color:#6f7d70}.tabs{border-bottom:1px solid var(--line);display:flex;gap:22px;margin:15px 0 25px;overflow:auto}.tabs button{border:0;border-radius:0;padding:12px 0;font-size:12px;white-space:nowrap}.tabs button.active{border-bottom:2px solid var(--green);color:var(--green)}.field{margin:0 0 22px}.field label{display:block;margin-bottom:8px;font-size:12px;font-weight:bold}.field small{display:block;text-align:right;font-size:10px;color:#7d8679;margin-top:5px}.script{font:13px/1.85 'Courier New',monospace;white-space:pre-wrap;overflow-wrap:anywhere;padding:30px;background:white;border:1px solid var(--line)}.box{background:#e9ede4;padding:24px;margin:22px 0}.box strong{display:block;margin-bottom:12px}.box p{font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row button{margin:3px 0}.item{padding:20px;background:#fff;border:1px solid var(--line);margin:15px 0}.item a{color:var(--green);font-size:12px}.item small{font-size:10px;color:#7d8679}.item p{font-size:12px;white-space:pre-wrap}.totals{display:flex;gap:15px;margin-bottom:23px}.totals div{background:#e4eadc;padding:20px;flex:1;border-radius:5px}.totals span{display:block;font-size:10px;color:#657664}.totals strong{font:30px Georgia,serif;display:block;margin-top:14px}.decisions{margin-bottom:25px;background:#fff;border:1px solid var(--line);padding:20px}.decisions summary{font-size:12px;cursor:pointer}.decisions .field{margin-top:25px}.fileInput{display:none}.uploadButton{display:inline-block;padding:9px 14px;border:1px solid #526e55;color:white;background:#1d2a22;cursor:pointer;border-radius:5px;font-size:11px}.introNote{background:#f0e7d8;border-left:3px solid #a28a63;padding:15px;margin-top:20px}.introNote p{font-size:12px}.smallHelp{font-size:11px;color:#788578;margin:8px 0}footer{padding:20px 40px;border-top:1px solid var(--line);font-size:9px;letter-spacing:1px;color:#839080}#mobileMenu{display:none}@media(max-width:750px){aside{transform:translateX(-100%);z-index:5;box-shadow:5px 0 20px #0003}aside.show{transform:none}.right{margin:0;width:100%}header{padding:0 18px}.status{font-size:9px}#mobileMenu{display:inline-block;border:0}.notice{padding:12px 20px}.content{padding:35px 20px 80px}.pagehead{flex-direction:column}h1{font-size:31px}.grid{grid-template-columns:1fr}.totals{gap:7px}.totals div{padding:13px 8px}.totals strong{font-size:22px}.premise{font-size:17px}.script{padding:18px;font-size:12px}}@media print{aside,header,.notice,.tabs,.back,button{display:none!important}.right{margin:0;width:100%}.content{padding:0}.script{border:none;padding:0}}
</style></head><body><div class="app"><aside id="sidebar"><div class="brand">VXLLES<small>LA PELÍCULA</small></div><nav id="nav"></nav><div class="bottom"><p>HIMNØS PARA<br>EL FIN DEL MUNDØ</p><button id="export">Descargar respaldo</button><label class="uploadButton">Importar respaldo<input class="fileInput" id="import" type="file" accept="application/json,.json"></label></div></aside><div class="right"><header><button id="mobileMenu" aria-label="Abrir menú">☰</button><span>PREPRODUCCIÓN / <b id="crumb">Historia</b></span><span class="status" id="status">Guardado en este navegador</span></header><div class="notice">Esta versión guarda cambios solo en el navegador donde se edita. Las copias de Nicolás y Camilo no se sincronizan entre sí.</div><main class="content" id="main"></main><footer>VXLLES · HISTORIA DEL SUJETO V</footer></div></div><script>
const SEED={"items": [{"id": "story-intro", "type": "story", "title": "Intro · La normalidad vigilada", "order": 0, "reviewed": {"at": 1792081468495, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Intro · La normalidad vigilada", "Guion": "PRÓLOGO — INT. VIVIENDA DEL RÉGIMEN — MAÑANA\n\nNEGRO. El agua corre detrás de una pared. En la habitación a oscuras, V abre los ojos. Aún no se ha encendido la pantalla. Permanece atento al sonido.\nAmbiente de tuberías. Respiración. Todavía no empieza el álbum.\n\nDesde el otro lado del tabique llega un tarareo. V gira hacia él. La pantalla se ilumina y una señal corta la voz del vecino. V sigue mirando el tabique.\nTarareo humano breve, sin melodía definida. Señal del sistema. El tarareo se interrumpe.\n\nEl altavoz emite el saludo. V se sienta en el borde de la cama. La pantalla da luz a su mano cuando se la lleva a la cara.\nVOZ DEL RÉGIMEN (V.O.): «Todo está en su lugar».\n\nV frota la pequeña marca de su mano. Se detiene, la examina y vuelve a frotarla. Un sonido de apertura en el pasillo lo devuelve a la rutina. Baja la mano y termina de vestirse.\nFricción de dedos, ropa, cerradura lejana. Sin diálogo.\n\nV sale al pasillo. El vecino se detiene a su altura. V descubre un botón sin abrochar y lo cierra mientras responde.\nVECINO: Buenos días, V: Buenos días.\n\nLa señal vuelve a sonar. El vecino avanza. V permanece un instante en su sitio. Mira hacia el recorrido habitual y, finalmente, lo sigue.\nLa señal termina. Pasos. El master CANCIÓN 1 comienza exactamente después de este bloque.", "Cómo termina y conecta": "V ya avanza; el corte conserva dirección y vestuario."}}, {"id": "story-C01", "type": "story", "title": "01 · LAS REVØLUCIØNES NUNCA EMPIEZAN CØN FLØRES", "order": 1, "reviewed": {"at": 1792081751501, "author": "Nicolás"}, "notes": [], "fields": {"Título": "01 · LAS REVØLUCIØNES NUNCA EMPIEZAN CØN FLØRES", "Guion": "A01 — INT. PASILLO / ARCHIVO — DÍA\n\nV recorre el pasillo detrás de los últimos vecinos. Una puerta de mantenimiento queda unos centímetros abierta. La corriente mueve la hoja, pero el cierre no encaja. V pasa un paso de largo y se detiene.\nComienza el master completo de LAS REVØLUCIONES NUNCA EMPIEZAN CØN FLØRES. Ambiente subordinado, por diseñar. Sin diálogo añadido.\n\nV mira hacia ambos extremos del pasillo. Los vecinos desaparecen por una esquina. Acerca la mano al picaporte, escucha y termina de abrir. Cruza el umbral sin soltar la hoja.\nMaster C01 continuo.\n\nDentro, V sostiene la puerta hasta que deja de moverse. Una luz del televisor atraviesa la estancia. V aparta una cortina de cables y descubre que detrás hay una mesa de archivo.\nMaster continuo. El televisor no añade una segunda reproducción de la canción.\n\nV se acerca al televisor. Una imagen del videoclip existente llama su atención. Apoya la mano en el borde del aparato y busca en la pantalla un detalle reconocible.\nMaster continuo. Imagen del videoclip existente: material pendiente de recibir; no recrearlo por defecto.\n\nJunto al televisor hay fichas y fotografías. V sigue la repetición de una misma imagen entre el papel y la pantalla. Desplaza una hoja para liberar una fotografía parcialmente tapada.\nMaster continuo.\n\nEn otra fotografía reconoce su propia postura o un rasgo corporal. Mira su mano, cambia de posición y compara. La coincidencia lo hace dejar de recorrer las fichas al azar.\nMaster continuo.\n\nV alinea dos fichas con fechas diferentes. Recorre con el dedo la distancia entre ellas. Vuelve hacia el televisor para comprobar si su imagen pertenece al mismo momento. No encuentra una explicación.\nMaster continuo. Textos de utilería pendientes de diseño y aprobación.\n\nAl apartar la segunda ficha descubre la fotografía de V con MUJER01. Su mano queda suspendida antes de tocar el papel. La retira y vuelve a acercarla, esta vez lentamente.\nMaster continuo.\n\nV observa el brazo de ella junto al suyo. Se toca el mismo lugar en el cuerpo. Mira el rostro de la mujer y trata de sostener la imagen; no hay flashback que responda todavía.\nMaster continuo.\n\nV acerca la pequeña lámpara de mesa a la fotografía y compara su mano con la mano retratada. La marca coincide. V mira hacia la puerta y deja la mano sobre el borde del papel.\nMaster continuo.\n\nV comprueba cómo está sujeta la fotografía. Libera una esquina con cuidado. La deja apoyada en el tablero mientras busca al lado la ficha que le corresponde. No la guarda aún.\nMaster continuo.\n\nEncuentra el número que une ficha y fotografía. Apoya una mano sobre cada una. Vuelve a mirar el rostro de la mujer. El último instante musical lo deja frente a una prueba de su vida, sin una respuesta.\nEl master llega a su final real sin estirarlo ni cortarlo. No situar aquí un golpe musical supuesto.", "Cómo termina y conecta": "misma posición al inicio del puente; lámpara encendida."}}, {"id": "story-puente01", "type": "story", "title": "Puente 01 · La fotografía", "order": 2, "reviewed": {"at": 1792081901563, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 01 · La fotografía", "Guion": "PUENTE 01 — INT. ARCHIVO — CONTINUO\n\nEn el silencio que deja la canción, V compara una vez más su mano con la foto. Suelta el aire sin apartar la vista.\nV: «Yo estuve ahí». Ambiente del archivo; sonido del televisor por diseñar, sin repetir el master.\n\nV acerca la fotografía a la lámpara y mira a la mujer. Baja apenas la voz, como si alguien pudiera contestarle desde el papel.\nV: «¿Quién eres?».\n\nUn zapato roza el suelo fuera. V apaga la lámpara una sola vez. Queda inmóvil en la luz residual del televisor. La mano continúa sujetando la fotografía.\nRoce de suela. Interruptor. Respiración contenida. Sin diálogo.\n\nLos pasos continúan. V retira la fotografía y la ficha del tablero, comprueba el número del expediente y guarda ambas en el interior de su ropa. Al retirar la mano vuelve a comprobar que no sobresalen.\nPapel, ropa y pasos que se alejan.\n\nV espera un último instante y se acerca a la puerta. Mira hacia el pasillo antes de salir. La hoja del archivo queda como la encontró. Se marcha con el número del expediente en mente.\nAmbiente del pasillo. Entra SØLØ UN FUNERAL al terminar este bloque.", "Cómo termina y conecta": "fuera, con las pruebas. SØLØ UN FUNERAL debe comenzar en otro punto de consulta, sin repetir este hallazgo."}}, {"id": "story-C02", "type": "story", "title": "02 · SØLO UN FUNERAL", "order": 3, "reviewed": {"at": 1792082125696, "author": "Nicolás"}, "notes": [{"id": "90c6dabe-e902-4a44-9484-f162e3644844", "text": "Complementar la historia entre que los agentes lo capturan y el salto, qué pasa ahí ?", "author": "Nicolás", "kind": "Comentario", "at": 1792082115718, "resolved": true, "resolvedBy": "Nicolás"}], "fields": {"Título": "02 · SØLO UN FUNERAL", "Guion": "A02 — INT. ARCHIVO / PASILLOS — DÍA\n\nCOMIENZA LA CANCIÓN 02. V consulta el número del expediente en otro punto del sistema, con la foto y la ficha que ya lleva consigo. No vuelve a encontrar las mismas pruebas. Una pantalla reproduce su entrada en el archivo con unos segundos de retraso. Oye una orden. Esconde las pruebas y corre. Las puertas se cierran delante de él.\n\nA03 — INT. SALA ELEVADA — TARDE\n\nDos agentes lo dejan frente a un ventanal. La mujer de la fotografía entra. V alza la foto.\nV Me conoces \nMUJER01\nLo suficiente para saber que volverías aquí.\nV\nEntonces dime quién era.\nElla extiende una mano. V retrocede hasta el cristal. En la confusión la arrastra consigo. La caída se cuenta con el cristal, la pérdida de horizonte y el golpe fuera de campo. No se presenta como liberación triunfal.\nDESPUÉS DE LA CAÍDA: V percibe a la mujer inmóvil y se marcha creyéndola muerta. Su supervivencia es un hecho de la historia; no mostrar una confirmación objetiva de muerte.", "Cómo termina y conecta": "V herido alcanza el bosque."}}, {"id": "story-puente02", "type": "story", "title": "Puente 02 · Después de la caída", "order": 4, "reviewed": {"at": 1792082241129, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 02 · Después de la caída", "Guion": "PUENTE 02 — EXT. LÍMITE DEL BOSQUE — OCASO / ATARDECER \n\nSilencio después del golpe. V inspira con dificultad. La luz de una búsqueda recorre las copas de los árboles.\nIntenta incorporarse. La pierna no lo sostiene. Palpa la ropa hasta encontrar la fotografía. Está doblada, pero sigue ahí.\nAGENTE (LEJOS)\nPor aquí.\nV arrastra el cuerpo hasta la sombra. Se tapa la boca para contener un gemido. Una rama cede bajo su mano. La luz gira.\nEN LA ÚLTIMA ACCIÓN: se interna en el bosque. ENTRA ATRAPADØ EN PESADILLAS.\nV cree que MUJER01 murió; ella sobrevive.  La huida no permite que V compruebe su estado.", "Cómo termina y conecta": "V entra herido en el bosque. Conserva la fotografía y cree que MUJER01 murió."}}, {"id": "story-C03", "type": "story", "title": "03 · ATRAPADØ EN PESADILLAS", "order": 5, "reviewed": {"at": 1792082564679, "author": "Nicolás"}, "notes": [], "fields": {"Título": "03 · ATRAPADØ EN PESADILLAS", "Guion": "A04 — EXT. BOSQUE — NOCHE\n\nCOMIENZA ATRAPADØ EN PESADILLAS. V avanza con dificultad. Una figura aparece donde esperaba encontrar salida; otra repite el gesto de la primera. No son monstruos arbitrarios: cada una encarna una forma distinta de acoso interior.\nV se detiene. Escucha su propia respiración bajo las voces. Cambia de dirección al ver una marca en un tronco. El símbolo reaparece sobre una puerta deteriorada.\n\nA05 — INT. CABAÑA — MADRUGADA\n\nV entra y sostiene la puerta con su cuerpo. Espera el golpe. No llega. Se desliza hasta el suelo sin soltar la foto.", "Cómo termina y conecta": "El símbolo en la cabaña promete una historia anterior."}}, {"id": "story-puente03", "type": "story", "title": "Puente 03 · Una cosa a la vez", "order": 6, "reviewed": {"at": 1792082739545, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 03 · Una cosa a la vez", "Guion": "PUENTE 03 — INT. CABAÑA — AMANECER\n\nLa claridad entra por una grieta de la cabaña. V sigue en el suelo. Escucha: no hay pasos.\nHay un recipiente de agua a pocos centímetros. Extiende el brazo y lo vuelca. Cierra los ojos. Después recoge el recipiente y vuelve a colocarlo.\nV\nUna cosa. Solo una.\nSe incorpora contra la pared. Esta vez alcanza el agua sin derramarla.\nMira la venda improvisada y luego la mesa. Hay algo con lo que podría empezar a cuidarse.\nEl primer gesto de reparación introduce KINTSUGI.", "Cómo termina y conecta": "V alcanza el agua y decide iniciar su cuidado dentro de la cabaña."}}, {"id": "story-C04", "type": "story", "title": "04 · KINTSUGI", "order": 7, "reviewed": {"at": 1792082943328, "author": "Nicolás"}, "notes": [], "fields": {"Título": "04 · KINTSUGI", "Guion": "A06 — INT. CABAÑA — DÍAS SUCESIVOS\n\nCOMIENZA LA CANCIÓN 04. Agua limpia. Una venda nueva. Una línea en una pared para contar los días. V fracasa al ponerse de pie; más adelante consigue llegar a la mesa. Los mismos encuadres registran pequeños cambios.\nEntre objetos reparados encuentra dibujos del símbolo y fotografías de otras personas. Los recuerdos llegan como sensaciones incompletas. No explican todavía el origen del refugio.\n\nA07 — INT. CABAÑA — ATARDECER\n\nV abre un compartimento. Dentro están el traje y la máscara. Comprueba sus costuras; no parecen nuevos. Se viste lentamente. La máscara inaugura su identidad pública. Después podrá quitársela en privado con el equipo; los flashbacks sí pueden mostrar su rostro.\n\nA08 — EXT. CABAÑA — NOCHE\n\nV provoca deliberadamente el incendio de la cabaña y se aleja. Desde una distancia segura observa el fuego. El motivo, los objetos salvados y la manera de representar el inicio del incendio quedan por desarrollar; no atribuirlo a otra persona. No se necesita describir un método práctico de ignición.", "Cómo termina y conecta": "El Sujeto V sale a buscar a otros."}}, {"id": "story-puente04", "type": "story", "title": "Puente 04 · El primer encuentro", "order": 8, "reviewed": {"at": 1792083040181, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 04 · El primer encuentro", "Guion": "PUENTE 04 — EXT. CAMINO — AMANECER\n\nAMANECE EN EL CAMINO. El fuego de la cabaña ya no se ve, pero el traje conserva una pequeña marca de ceniza. V se detiene en una bifurcación.\nDesde el pueblo llega una discusión: alguien intenta levantar una pieza pesada. V gira hacia ese sonido.\nPERSONA DEL PUEBLO (FUERA DE CAMPO)\nSi la sueltas ahora, no la levantamos.\nV entra en el lugar, deja su carga en el suelo y sostiene el otro extremo. La persona lo mira por primera vez.\nCORTE sobre el esfuerzo compartido. ENTRA EL INTERNØ Y EL DICTADØR.", "Cómo termina y conecta": "V sostiene una carga junto a otra persona: su primer vínculo nace de ayudar."}}, {"id": "story-C05", "type": "story", "title": "05 · EL INTERNØ Y EL DICTADØR", "order": 9, "reviewed": {"at": 1792083661068, "author": "Nicolás"}, "notes": [], "fields": {"Título": "05 · EL INTERNØ Y EL DICTADØR", "Guion": "A09 — EXT. PUEBLOS / CAMINOS — DÍA\n\nCOMIENZA EL INTERNØ Y EL DICTADØR. V ofrece ayuda antes de pedirla. Una persona repara un receptor; otra conoce pasos fuera de los controles. Un tercero no confía en EL. V permanece y escucha.\nPROPUESTA: presentar aquí al futuro amigo que morirá y sembrar a la criatura compañera, Y LA MASCOTA aunque END ØF ME sea su capítulo protagonista.\n\nA10 — INT. REFUGIO — NOCHE\n\nEl grupo despliega mapas y piezas sobre una mesa. Cada persona añade algo. V deja la foto en el centro.\nALIADO\n¿Quieres respuestas o quieres sacarlos de ahí?\nV\nEmpecé por las respuestas.\nAparta la foto para hacer espacio al mapa.\nV\nAhora somos más.", "Cómo termina y conecta": "Están organizando un plan, mirando un muro con un mapa "}}, {"id": "story-puente05", "type": "story", "title": "Puente 05 · El sobre", "order": 10, "reviewed": {"at": 1792083780935, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 05 · El sobre", "Guion": "PUENTE 05 — INT. HABITACIÓN DEL REFUGIO — NOCHE\n\nV está solo en una habitación del refugio. Deja la fotografía sobre la mesa. Alguien llama sin abrir la puerta.\nV\nPasa.\nEl aliado le entrega un sobre viejo.\nALIADO\nEstaba entre lo que recuperamos. Reconocí la letra.\nV observa su nombre en el papel.\nV\n¿Cuándo lo encontraron?\nALIADO\nNo sé de cuándo es. Pensé que debías verlo tú.\nEl aliado sale. V espera a oír sus pasos alejarse antes de abrir el sobre.\nEl sonido del papel conduce a DESPEDIDÆ. La procedencia exacta del hallazgo debe resolverse en D06.", "Cómo termina y conecta": "V se queda solo con el sobre abierto y reconoce su propia letra."}}, {"id": "story-C06", "type": "story", "title": "06 · DESPEDIDÆ", "order": 11, "reviewed": {"at": 1792084012238, "author": "Nicolás"}, "notes": [], "fields": {"Título": "06 · DESPEDIDÆ", "Guion": "A11 — INT. REFUGIO / FRAGMENTOS DEL PASADO — NOCHE\n\nCOMIENZA LA CANCIÓN 06. V reconoce su escritura. Las palabras concretas de la carta se escribirán después de revisar la letra de la canción, para no competir con ella.\nFlashbacks: una mesa desordenada, mensajes sin contestar, una mano que ofrece compañía. MUJER01 promete descanso. V acepta seguirla. La puerta del Régimen se cierra detrás de ambos.\nREGLA DEFINIDA: los flashbacks pueden mostrar el rostro de Nicolás. En el presente de esta escena, solo puede retirarse la máscara si está con su grupo.\n\nA12 — INT. REFUGIO — CONTINUO\n\nEl papel tiembla. V lo coloca sobre la mesa en vez de romperlo. Cae un medallón. En el reverso, unas coordenadas.", "Cómo termina y conecta": "Las coordenadas convierten el recuerdo en una misión."}}, {"id": "story-puente06", "type": "story", "title": "Puente 06 · Las coordenadas / A → B", "order": 12, "reviewed": {"at": 1792084066155, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 06 · Las coordenadas / A → B", "Guion": "PUENTE 06 — INT. SALA COMÚN — AMANECER\n\nV llega a la sala común con la carta y el medallón. El grupo deja libre un espacio en el mapa.\nALIADO\nSon coordenadas.\nV\n¿Puedes encontrarlas?\nEl aliado recorre el papel, compara dos marcas y se detiene.\nALIADO\nAquí. Pero esto no es una salida.\nV mira la puerta del refugio. Luego mira a quienes siguen alrededor de la mesa.\nV\nEntonces hay alguien dentro.\nPreparan una ruta de reconocimiento. El medallón queda sobre el punto marcado.\nFIN DEL LADO A. El corte a ese mismo lugar abre EGØ y el LADO B.", "Cómo termina y conecta": "El grupo sale a reconocer el lugar indicado por el medallón."}}, {"id": "story-C07", "type": "story", "title": "07 · EGØ", "order": 13, "reviewed": {"at": 1792084173122, "author": "Nicolás"}, "notes": [], "fields": {"Título": "07 · EGØ", "Guion": "B01 — EXT. DISTRITO DE PANTALLAS — DÍA\n\nCOMIENZA LA CANCIÓN 07. La coordenada del medallón coincide con una señal en la calle. El grupo avanza entre ciudadanos inmóviles ante sus propias imágenes.\nEn una pantalla, un rostro sonríe. Frente a ella, la persona real permanece inexpresiva. V levanta una mano hacia un control. Un aliado lo detiene: el cable también alimenta una puerta de salida. Cortarlo a ciegas los encerraría.\nV observa el recorrido de los emisores. Marca una entrada y una salida. Se llevan conocimiento, no una victoria.", "Cómo termina y conecta": "Ya conocen qué deben intervenir y a quién deben proteger."}}, {"id": "story-puente07", "type": "story", "title": "Puente 07 · El plan", "order": 14, "reviewed": {"at": 1792084186856, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 07 · El plan", "Guion": "PUENTE 07 — INT. REFUGIO — NOCHE\n\nDE VUELTA EN EL REFUGIO. El mapa ahora contiene las entradas y los emisores del distrito. Un aliado separa dos piezas sobre la mesa: salida y emisión.\nV\nPrimero la puerta. Después el sonido.\nALIADO01\nSi lo hacemos al revés, los dejamos dentro.\nOtra persona señala la ruta de retirada.\nV\n¿Y si esto cambia?\nALIADO01\nNo improvisamos solos. Volvemos a escucharnos.\nCada integrante toma una tarea. El amigo guarda su objeto personal, que debe elegirse antes de cerrar D08.\nEl último gesto de preparación abre D.N.A.", "Cómo termina y conecta": "El grupo tiene tareas y una ruta de retirada para la primera intervención."}}, {"id": "story-C08", "type": "story", "title": "08 · D.N.A", "order": 15, "reviewed": {"at": 1792084401067, "author": "Nicolás"}, "notes": [], "fields": {"Título": "08 · D.N.A", "Guion": "B02 — INT. NODO DE EMISIÓN — NOCHE\n\nCOMIENZA D.N.A. El equipo ejecuta las tareas acordadas. Una puerta se abre; por unos instantes oímos voces distintas. El Régimen cambia el recorrido de los controles. El plan deja de servir.\nEl aliado ya presentado en EL INTERNØ decide sostener una salida para otros. V intenta regresar. La distancia aumenta. Un golpe interrumpe la comunicación. Evitar una muerte anónima: su elección y vínculo deben estar establecidos antes.\n\nB03 — EXT. RUTA DE RETIRADA — NOCHE\n\nLos supervivientes salen con ciudadanos liberados. V busca al amigo entre ellos. Nadie puede responderle. Lleva consigo un objeto que ya pertenecía al amigo; decidir cuál al cerrar su ficha.", "Cómo termina y conecta": "La ausencia del amigo detiene a V."}}, {"id": "story-puente08", "type": "story", "title": "Puente 08 · La silla vacía", "order": 16, "reviewed": {"at": 1792084459354, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 08 · La silla vacía", "Guion": "PUENTE 08 — INT. REFUGIO — DÍAS DESPUÉS\n\nHan pasado días. La comida de V apenas ha cambiado de lugar. El mapa sigue doblado. Se oyen pasos y trabajo en el resto del refugio.\nUn aliado deja agua a su alcance.\nALIADO\nVoy a estar afuera.\nNo recibe respuesta. No la exige.\nLa criatura se sienta junto a V. Mira el objeto del amigo y luego la puerta. Espera. V no se mueve.\nMás tarde, la criatura cruza la sala común y recoge lo necesario para su propia salida. Alguien la ve y le abre paso.\nSu primera acción autónoma inicia END ØF ME.", "Cómo termina y conecta": "V sigue aislado; la criatura inicia una salida propia desde el refugio."}}, {"id": "story-C09", "type": "story", "title": "09 · END ØF ME", "order": 17, "reviewed": {"at": 1792084515937, "author": "Nicolás"}, "notes": [], "fields": {"Título": "09 · END ØF ME", "Guion": "B04 — EXT. DESIERTO / VEHÍCULO — DÍA\n\nCOMIENZA LA CANCIÓN 09. La criatura carga un objeto del refugio en un vehículo demasiado grande para ella. Se equivoca de cajón, insiste, consigue poner en marcha su pequeña expedición. Su humor nace del esfuerzo, no de ridiculizar el dolor de V.\nPROPUESTA A DESARROLLAR: va a buscar una señal de los rescatados y vuelve para llevar a V a verla. Si conduce, fijar antes su capacidad y diseño físico.\n\nB05 — EXT. PUESTO DE LOS RESCATADOS — ATARDECER\n\nV ve que alguien reparó una radio; otra persona distribuye agua. Una acción de su amigo continúa en las acciones de otros. V sostiene el objeto que heredó. La criatura le ofrece espacio, no una orden.\nV\nTodavía pesa.\nALIADO\nPuedes llevarlo con nosotros.", "Cómo termina y conecta": "V regresa al plan con una forma distinta de liderar."}}, {"id": "story-puente09", "type": "story", "title": "Puente 09 · Volver a escuchar", "order": 18, "reviewed": {"at": 1792084529021, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 09 · Volver a escuchar", "Guion": "PUENTE 09 — INT. VEHÍCULO / REFUGIO — NOCHE\n\nEl grupo está otra vez alrededor del mapa. V lo despliega y señala el punto donde perdieron al amigo.\nV\nAquí dejamos de escucharnos.\nALIADO\nEl plan también falló.\nV mantiene la mano sobre la marca. Asiente.\nV\nEntonces cambiemos el plan.\nUna persona propone otra entrada. Otra corrige la salida. La criatura ocupa un espacio entre ellos. La ausencia del amigo sigue presente en un objeto sobre la mesa.\nV\nEsta vez, si cambia algo, lo sabemos todos.\nEl grupo prepara la operación que abre LØNELY ANYMØRE.", "Cómo termina y conecta": "V vuelve a participar en el plan, admite el fallo y escucha al grupo."}}, {"id": "story-C10", "type": "story", "title": "10 · LØNELY ANYMØRE", "order": 19, "reviewed": {"at": 1792084660805, "author": "Nicolás"}, "notes": [], "fields": {"Título": "10 · LØNELY ANYMØRE", "Guion": "B06 — INT. NÚCLEO DEL RÉGIMEN — NOCHE\n\nCOMIENZA LA CANCIÓN 10. El grupo entra por rutas distintas. Pantallas reproducen las mismas acusaciones con rostros diferentes. V reconoce una frase que había creído propia.\nMUJER01 aparece al otro lado del control. V comprende que ella sobrevivió a la caída. Esta supervivencia está confirmada por Nicolás.\nMUJER01\nSin esto, no sabes lo que vas a sentir.\nV\nEso lo decido yo.\nEl enfrentamiento ocurre mientras los aliados abren salidas. Desactivar el sistema depende de ellos, no solo de la pelea de V.\n\nB07 — INT. NÚCLEO / SALIDA — CONTINUO\n\nLa antagonista cae en el desenlace. MUJER02 llega. Dejar por decidir si ella ejecuta el golpe final, tal como propone la base en L’AMØUR, o interviene de otro modo. No filmar dos versiones contradictorias como si fueran una.", "Cómo termina y conecta": "La llegada de MUJER02 abre una memoria afectiva."}}, {"id": "story-puente10", "type": "story", "title": "Puente 10 · La voz conocida", "order": 20, "reviewed": {"at": 1792084726873, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 10 · La voz conocida", "Guion": "PUENTE 10 — EXT. SALIDA DEL NÚCLEO — AMANECER\n\nFUERA DEL NÚCLEO. El ruido del sistema ha cesado. Se oyen las voces de quienes acaban de salir. V permanece junto al acceso.\nMUJER02 se detiene a unos pasos. No intenta tocarlo.\nMUJER02\nNo sabía si ibas a escucharme.\nV gira hacia la voz.\nV\nTe conozco.\nMUJER02\nPodemos ir despacio.\nEntre ambos aparece el gesto u objeto que se habrá sembrado antes. Todavía está por elegir: D10.\nV da un paso. ENTRA L’AMØUR DE RETØUR.\nLa muerte de MUJER01 ya debe haber quedado resuelta visualmente al final de C10; este puente no vuelve a ejecutarla.", "Cómo termina y conecta": "V reconoce la voz de MUJER02 y elige acercarse a ella."}}, {"id": "story-C11", "type": "story", "title": "11 · L’AMØUR DE RETØUR", "order": 21, "reviewed": {"at": 1792084885107, "author": "Nicolás"}, "notes": [], "fields": {"Título": "11 · L’AMØUR DE RETØUR", "Guion": "B08 — EXT. TERRAZA / COMUNIDAD — DÍA\n\nCOMIENZA LA CANCIÓN 11. El reencuentro continúa hacia una fiesta. El grupo aparta muebles y abre espacio para bailar. Una invitación pasa de una persona a otra. V se queda en el borde hasta que MUJER02 ofrece un gesto sencillo para entrar juntos. Se desajustan, se buscan y vuelven a coincidir. No bailar cada palabra de la letra: responder a cambios y acentos cuando se hayan marcado en el audio.\nLa dirección festiva viene de Nicolás; esta forma concreta de abrir la pista es una propuesta de escritura.\n\nB09 — INT./EXT. REFUGIO ABIERTO — TARDE\n\nLa fiesta reúne al equipo, la criatura y MUJER02. Hay contacto, juego y movimiento. Un objeto del amigo mantiene su presencia sin convertir el baile en un funeral. Una pausa permite un gesto íntimo antes de volver a la celebración. Si la fiesta es privada y está solo su grupo, V puede quitarse la máscara; si hay público ajeno, la conserva. La decisión sobre quién asiste debe fijarse antes de planear ese gesto.", "Cómo termina y conecta": "El reencuentro abre una vida cotidiana compartida."}}, {"id": "story-puente11", "type": "story", "title": "Puente 11 · La vida que sigue", "order": 22, "reviewed": {"at": 1792084908658, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Puente 11 · La vida que sigue", "Guion": "PUENTE 11 — EXT. CAMINO DE REGRESO — ATARDECER\n\nLa fiesta ha terminado. El espacio del refugio empieza a quedar vacío y algunas personas recogen. V recoge un objeto del amigo y lo coloca donde pueda verse. MUJER02 lo acompaña al camino.\nMUJER02\nNo tienes que volver a ser el de antes.\nV mira hacia el lugar donde el grupo sigue trabajando.\nV\nTampoco quiero empezar borrándolo.\nMUJER02 se queda a su lado. No hace falta responder. La criatura aparece con algo cotidiano que necesita ayuda.\nV vuelve con ellos. Ese regreso a una tarea común abre MALØS MØMENTØS.", "Cómo termina y conecta": "Después de la fiesta, V vuelve a una tarea cotidiana con su comunidad."}}, {"id": "story-C12", "type": "story", "title": "12 · MALØS MØMENTØS", "order": 23, "reviewed": {"at": 1792085016117, "author": "Nicolás"}, "notes": [], "fields": {"Título": "12 · MALØS MØMENTØS", "Guion": "B10 — EXT. COMUNIDAD — DÍAS DESPUÉS\n\nCOMIENZA LA CANCIÓN 12. Lugares antes simétricos admiten pequeñas diferencias. Alguien cierra una pantalla para hablar con otra persona. V escucha sin vigilar cada salida. El grupo comparte una actividad cotidiana concreta por definir.\nEl objeto del amigo encuentra un lugar visible. MUJER02 y la criatura están presentes. El símbolo pertenece ahora a más de una persona.", "Cómo termina y conecta": "Una señal mínima deja abierta la continuación."}}, {"id": "story-coda", "type": "story", "title": "Coda · La señal que permanece", "order": 24, "reviewed": {"at": 1792085031013, "author": "Nicolás"}, "notes": [], "fields": {"Título": "Coda · La señal que permanece", "Guion": "B11 — INT. PUESTO ABANDONADO DEL RÉGIMEN — NOCHE\n\nLa canción MALØS MØMENTØS ha terminado. En un puesto abandonado del Régimen, un indicador apagado recibe un pulso. Una grabación intenta empezar su frase y se interrumpe antes de terminarla. No aparece una nueva fuerza ni se explica el futuro: basta con reconocer una señal del sistema.\n\nB12 — EXT. COMUNIDAD — CONTINUO\n\nVolvemos a la comunidad y a una respiración humana. V levanta apenas la cabeza. No se separa de los demás. NEGRO. FIN DE ESTA PELÍCULA.", "Cómo termina y conecta": "V permanece junto a los demás; la señal del sistema deja abierto el futuro sin borrar la victoria."}}], "premise": "En una sociedad que controla las emociones, un hombre descubre que su vida ha sido intervenida. Para recuperar su memoria deberá reconstruirse, aceptar ayuda y convertirse en el Sujeto V: un símbolo capaz de devolver el sonido a quienes obligaron a callar.", "faceRule": "Símbolo: estrella polar de siete puntas, gota inferior y círculo. Falta archivo maestro aprobado. Hasta KINTSUGI el rostro es visible. Después, V mantiene la máscara en público y frente a personas ajenas al equipo. Puede quitársela cuando está a solas con su grupo. Los flashbacks sí pueden mostrar su cara. Mismo cuerpo, manos y manera de caminar. Su rostro tiene como referencia a Nicolás.", "decisions": {"D01": {"title": "La primera muerte de MUJER01", "question": "Resuelta mediante el comentario de Nicolás en Historia.", "answer": "MUJER01 no muere en el segundo vídeo. V cree que ha muerto; ella sobrevive y reaparece más adelante. No confirmar su muerte con un cadáver inequívoco ni narración objetiva.", "originalStatus": "Resuelto", "choices": []}, "D02": {"title": "Quién da el golpe final", "question": "LØNELY ANYMØRE y L’AMØUR atribuyen de forma distinta el desenlace.", "answer": "La mujer numero 2 ", "originalStatus": "En revisión", "choices": ["MUJER02 da el golpe final, como plantea la base.", "V derrota a MUJER01 y MUJER02 interviene sin matarla.", "El grupo neutraliza a MUJER01; escribir aquí otro desenlace."]}, "D03": {"title": "Duración total de la película", "question": "Confirmado por Nicolás: los 40 minutos son exclusivamente las 12 canciones. La intro, los puentes y las escenas narrativas adicionales se suman.", "answer": "La música ocupa la duración de los doce archivos seleccionados: referencia técnica 39:39.858. Intro, puentes, coda y otras escenas fuera de canciones suman duración. La regla de sumar narrativa fue confirmada por Nicolás; la cifra se actualiza al inventario recibido.", "originalStatus": "Resuelto", "choices": []}, "D04": {"title": "Nombre y reglas del antagonista", "question": "Lore y Régimen se usan como nombres intercambiables.", "answer": "", "originalStatus": "En revisión", "choices": ["Usar Régimen para la organización y retirar Lore de los diálogos.", "Distinguir Lore como entidad y Régimen como su organización; explicar sus límites."]}, "D05": {"title": "El rostro después de KINTSUGI", "question": "Regla consolidada a partir de la biblia, la ficha de V y el comentario del autor.", "answer": "Hasta KINTSUGI el rostro es visible. Después, V mantiene la máscara en público y frente a personas ajenas al equipo. Puede quitársela cuando está a solas con su grupo. Los flashbacks sí pueden mostrar su cara. Mismo cuerpo, manos y manera de caminar. Su rostro tiene como referencia a Nicolás.", "originalStatus": "Resuelto", "choices": []}, "D06": {"title": "Origen de cabaña, traje y carta", "question": "V encuentra objetos decisivos; sus causas no están fijadas.", "answer": "No se necesita, cabaña olvidada por alguien ", "originalStatus": "En revisión", "choices": ["El equipo preparó la cabaña y conservó la carta; fijar quién y cuándo.", "V participó en su preparación antes de perder la memoria; fijar el recorrido de la carta."]}, "D07": {"title": "Por qué arde la cabaña", "question": "CONFIRMADO: V provoca el incendio y se marcha. PENDIENTE: por qué lo hace y qué salva antes de hacerlo.", "answer": "V La incendia ", "originalStatus": "En revisión", "choices": ["V borra un rastro que pondría en peligro al grupo.", "V impide que el Régimen recupere lo que permanece en la cabaña."]}, "D08": {"title": "El amigo que muere", "question": "La pérdida necesita una persona y vínculo previo.", "answer": "un amigo que se hizo en el camino, muere ", "originalStatus": "En revisión", "choices": ["Desarrollar ALIADO01 como amigo que muere: completar nombre, deseo y objeto.", "Crear otro amigo y escribir sus escenas previas a D.N.A."]}, "D09": {"title": "Criatura y misión propia", "question": "END ØF ME tiene una dirección emocional, pero la acción sigue abierta.", "answer": "Una criatura tierna, que se encarga de levantarlo en END ØF ME ", "originalStatus": "En revisión", "choices": ["La criatura busca a los rescatados mientras V sigue aislado; regresa con una posibilidad de contacto.", "La criatura lleva a V al viaje; su participación comienza siendo pasiva."]}, "D10": {"title": "La mujer del reencuentro", "question": "Su aparición final necesita preparación y una búsqueda propia.", "answer": "si estaba oculta esperando a que V se rebelara ", "originalStatus": "En revisión", "choices": ["MUJER02 pertenece a su vida anterior; elegir recuerdo o gesto que la siembre.", "MUJER02 mantiene una relación anterior con el grupo; definir qué buscó durante la ausencia."]}, "D11": {"title": "Material musical y visual existente", "question": "Recibidos ZIP musical y PDF de letras de 13 páginas. Seleccionados 12 audios; Nicolás confirmó el archivo 05 con título El INTERNØ & EL DICTADØR. Aún faltan el videoclip existente para la pantalla y el símbolo maestro; no hay mapa de frases sincronizado ni confirmación de masters definitivos.", "answer": "", "originalStatus": "En revisión", "choices": []}, "D12": {"title": "Revisión completa del vídeo", "question": "PDF leído; resúmenes técnicos de Zoom revisados. No se ha leído una transcripción completa ni visto la totalidad de las tres horas.", "answer": "", "originalStatus": "En revisión", "choices": []}, "D13": {"title": "Acceso de Camilo", "question": "Falta correo para habilitar acceso privado al sitio.", "answer": "", "originalStatus": "En revisión", "choices": []}}, "source": "Respaldo de Nicolás · 15 octubre 2026", "version": "0.5"};
const MENU=[['Historia','story'],['Listado de Locaciones','location'],['Listado de Personajes','character'],['Listado de elementos Clave','element'],['Metraje total','footage']];
const TEMPLATES={location:['Nombre','Descripción del lugar','Escenas donde aparece','Ambiente, luz y color','Detalles y continuidad','Notas'],character:['Nombre','Papel en la historia','Descripción física','Personalidad y motivación','Vestuario y evolución','Relaciones','Notas'],element:['Nombre','Qué es y qué significa','Quién lo usa','Escenas donde aparece','Aspecto y materiales','Cambios y continuidad','Notas'],footage:['Orden','Nombre','Tipo de metraje','Duración (mm:ss)','Acción / contenido','Conexión con el siguiente bloque','Notas']};
const SINGULAR={location:'locación',character:'personaje',element:'elemento',footage:'bloque de metraje'};
const STORE='vxlles-standalone-v05';
function fresh(){return{version:'0.5-static',fields:{},records:{location:[{id:'location-blank',fields:{}}],character:[{id:'character-blank',fields:{}}],element:[{id:'element-blank',fields:{}}],footage:[{id:'footage-blank',fields:{}}]},references:{},comments:{},updated:null};}
let data;try{data=JSON.parse(localStorage.getItem(STORE)||'null')||fresh();if(!data.records)throw Error()}catch{data=fresh()}
let section='story',selected=null,tab='contenido';const main=document.querySelector('#main'),status=document.querySelector('#status');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function div(cls){return el('div',cls)}function val(key,fallback=''){return Object.hasOwn(data.fields,key)?data.fields[key]:fallback}
function save(){data.updated=new Date().toISOString();try{localStorage.setItem(STORE,JSON.stringify(data));status.textContent='Guardado aquí · '+new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});}catch{status.textContent='Sin espacio para guardar. Descarga un respaldo.'}}
function field(host,key,label,original='',opts={}){const wrap=div('field'),lab=el('label','',label);wrap.append(lab);let input;if(opts.choice){input=el('select');for(const choice of ['',...opts.choice]){const o=el('option','',choice);o.value=choice;input.append(o)}}else input=el(opts.long?'textarea':'input');input.value=val(key,original);lab.append(input);const meta=el('small','',Object.hasOwn(data.fields,key)?'Editado aquí':'');wrap.append(meta);input.addEventListener('input',()=>{data.fields[key]=input.value;save();meta.textContent='Guardado aquí'});host.append(wrap);return input}
function titleRecord(record){return val(record.id+'/Nombre',record.fields.Nombre||'')||'Sin nombre'}
function secs(v){const m=String(v||'').trim().match(/^(\d+):([0-5]\d)(?:[.,](\d{1,3}))?$/);return m?Number(m[1])*60+Number(m[2])+Number('0.'+(m[3]||'0')):null}
function tm(v){const n=Math.round(v*1000),s=Math.floor(n/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+(n%1000?'.'+String(n%1000).padStart(3,'0'):'')}
function button(text,click,cls=''){const b=el('button',cls,text);b.addEventListener('click',click);return b}
function nav(s){section=s;selected=null;tab='contenido';document.querySelector('#sidebar').classList.remove('show');render();window.scrollTo(0,0)}
function heading(title,desc,action){const h=div('pagehead'),left=div();left.append(el('div','eyebrow',String(MENU.findIndex(x=>x[1]===section)+1).padStart(2,'0')+' / SALA DE LA PELÍCULA'),el('h1','',title),el('p','',desc));h.append(left);if(action)h.append(action);main.append(h)}
function renderNav(){const target=document.querySelector('#nav');target.replaceChildren();for(let i=0;i<MENU.length;i++){const [label,id]=MENU[i],b=button('',()=>nav(id),id===section?'active':'');b.append(el('b','',String(i+1).padStart(2,'0')),el('span','',label));target.append(b)}document.querySelector('#crumb').textContent=MENU.find(x=>x[1]===section)[0]}
function render(){renderNav();main.replaceChildren();if(!selected)renderList();else renderDetail()}
function storyList(){heading('Historia','La película escrita en 25 puntos, conservada del respaldo de Nicolás.');const premise=div('premise');premise.textContent=SEED.premise;main.append(premise);const details=el('details','decisions'),sum=el('summary','','Respuestas y reglas de la historia');details.append(sum,el('p','smallHelp',SEED.faceRule));for(const [id,d] of Object.entries(SEED.decisions).filter(([id])=>!['D11','D12','D13'].includes(id))){field(details,'decision/'+id,d.title,d.answer,{long:true})}main.append(details);const list=div('storyList');SEED.items.forEach((i,n)=>{const b=button('',()=>{selected=i.id;render();window.scrollTo(0,0)});const body=div();body.append(el('strong','',val(i.id+'/Título',i.title)),el('small','',val(i.id+'/Cómo termina y conecta',i.fields['Cómo termina y conecta'])));b.append(el('span','',String(n+1).padStart(2,'0')),body);list.append(b)});main.append(list)}
function catalog(){heading(MENU.find(x=>x[1]===section)[0],'Formato vacío para completar juntos, con espacio para referentes.',button('＋ Añadir '+SINGULAR[section],()=>{const id=section+'-'+crypto.randomUUID();data.records[section].push({id,fields:{}});save();selected=id;render()},'primary'));if(section==='footage'){const records=data.records.footage,measured=records.map(r=>({value:secs(val(r.id+'/Duración (mm:ss)')),kind:val(r.id+'/Tipo de metraje')})).filter(x=>x.value!==null),music=measured.filter(x=>x.kind==='Canción').reduce((a,x)=>a+x.value,0),other=measured.filter(x=>x.kind!=='Canción').reduce((a,x)=>a+x.value,0),tot=div('totals');for(const [label,n,show] of [['Total',music+other,measured.length],['Música',music,measured.some(x=>x.kind==='Canción')],['Otros bloques',other,measured.some(x=>x.kind!=='Canción')]]){const c=div();c.append(el('span','',label),el('strong','',show?tm(n):'—'));tot.append(c)}main.append(tot,el('p','hint','La intro, los puentes y la coda se suman a la música. No hay duraciones cargadas de antemano.'))}const grid=div('grid');data.records[section].forEach((r,n)=>{const b=button('',()=>{selected=r.id;render();window.scrollTo(0,0)},'card');b.append(el('div','eyebrow','FICHA '+String(n+1).padStart(2,'0')),el('strong','',titleRecord(r)==='Sin nombre'?'Completar '+SINGULAR[section]:titleRecord(r)),el('small','','Abrir y editar →'));grid.append(b)});main.append(grid)}
function renderList(){if(section==='story')storyList();else catalog()}
function notes(key){return data.comments[key]||[]}
function references(key){return data.references[key]||[]}
function renderDetail(){const item=section==='story'?SEED.items.find(i=>i.id===selected):data.records[section].find(i=>i.id===selected);if(!item){selected=null;renderList();return}main.append(button('← Volver a '+MENU.find(x=>x[1]===section)[0].toLowerCase(),()=>{selected=null;render()},'back'));const title=section==='story'?val(item.id+'/Título',item.title):(titleRecord(item)==='Sin nombre'?'Nueva '+SINGULAR[section]:titleRecord(item));heading(title,section==='story'?'Punto '+(SEED.items.indexOf(item)+1)+' · revisado en el respaldo original':'Ficha en desarrollo');const tabs=div('tabs');for(const [id,label] of [['contenido','Contenido'],['referentes','Referentes'],['comentarios','Comentarios']])tabs.append(button(label,()=>{tab=id;renderDetailRoot()},tab===id?'active':''));main.append(tabs);renderTab(item)}
function renderDetailRoot(){render()}
function renderTab(item){if(tab==='contenido'){if(section==='story'){const script=div('script');script.textContent=val(item.id+'/Guion',item.fields.Guion);main.append(script);const box=div('box');box.append(el('strong','','El hilo continúa'),el('p','',val(item.id+'/Cómo termina y conecta',item.fields['Cómo termina y conecta'])));main.append(box);const edit=el('details','decisions');edit.append(el('summary','','Editar este punto'));field(edit,item.id+'/Título','Título',item.title);field(edit,item.id+'/Guion','Guion',item.fields.Guion,{long:true});field(edit,item.id+'/Cómo termina y conecta','Cómo termina y conecta',item.fields['Cómo termina y conecta'],{long:true});main.append(edit);for(const n of item.notes||[]){const d=div('introNote');d.append(el('strong','',n.author||'Nota original'),el('p','',n.text));main.append(d)}}else{for(const name of TEMPLATES[section])field(main,item.id+'/'+name,name,item.fields[name]||'',{long:!['Nombre','Orden','Duración (mm:ss)','Tipo de metraje'].includes(name),choice:name==='Tipo de metraje'?['Canción','Intro','Puente','Escena adicional','Coda']:null});if(section==='footage'&&secs(val(item.id+'/Duración (mm:ss)'))===null&&val(item.id+'/Duración (mm:ss)'))main.append(el('p','hint','Usa minutos:segundos, por ejemplo 01:30.'))}}if(tab==='referentes'){main.append(el('h2','','Referentes'));const url=field(main,'draft-reference-url','Enlace',''),note=field(main,'draft-reference-note','Qué interesa de este referente','',{long:true});const add=button('＋ Añadir referente',()=>{if(!/^https?:\/\//i.test(url.value)){alert('Añade un enlace que empiece por https://');return}(data.references[item.id] ||= []).push({url:url.value,note:note.value});delete data.fields['draft-reference-url'];delete data.fields['draft-reference-note'];save();render()},'primary');main.append(add,el('p','smallHelp','Para imágenes, PDF, audio o vídeo, coloca un enlace a un archivo compartido.'));for(const r of references(item.id)){const d=div('item');d.append(el('p','',r.note));const a=el('a','',r.url);a.href=/^https?:\/\//i.test(r.url)?r.url:'#';a.target='_blank';a.rel='noreferrer';d.append(a);main.append(d)}}if(tab==='comentarios'){main.append(el('h2','','Comentarios'));for(const c of notes(item.id)){const d=div('item');d.append(el('strong','',c.author),el('p','',c.text),el('small','',c.at));main.append(d)}const who=el('select');for(const name of ['Nicolás','Camilo']){const opt=el('option','',name);who.append(opt)}main.append(who);const txt=el('textarea');txt.placeholder='Escribe tu comentario';main.append(txt,button('Añadir comentario',()=>{if(!txt.value.trim())return;(data.comments[item.id] ||= []).push({author:who.value,text:txt.value.trim(),at:new Date().toLocaleString('es')});save();render()},'primary'))}}
function exportData(){const blob=new Blob([JSON.stringify({version:'0.5-static',data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='VXLLES-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
document.querySelector('#export').addEventListener('click',exportData);document.querySelector('#import').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.data?.records||!x.data?.fields)throw Error('Formato incompatible');if(!confirm('Esto reemplazará la copia guardada en este navegador. ¿Continuar?'))return;data=x.data;save();nav('story')}catch{alert('No pude importar este respaldo.')}});document.querySelector('#mobileMenu').addEventListener('click',()=>document.querySelector('#sidebar').classList.toggle('show'));render();
</script></body></html>
